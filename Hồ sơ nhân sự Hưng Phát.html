<style>
/* Layout: fixed left menu (collapsible; top strip on phones) + page header + content cards. Brand green, chart series from a validated categorical palette. */
:root{
  --bg:#eef3ef; --surface:#ffffff; --surface-2:#f2f6f3; --border:#dbe5de; --text:#16231b; --muted:#5d6d63; --faint:#8a988f;
  --accent:#2f6b3f; --accent-2:#5c9a69; --accent-soft:#e2efe4; --accent-text:#ffffff;
  --danger:#b42318; --danger-soft:#fdecea; --warn:#8a5300; --warn-soft:#fff3dc; --ok:#1d7a3a; --ok-soft:#e3f3e7; --info:#0e7490; --info-soft:#e0f4f7;
  --overlay:rgba(14,24,18,.45); --toast-bg:#16231b; --toast-fg:#ffffff;
  --grid:#e4e9e5; --axis:#c6d0c9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --radius:16px; --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1511; --surface:#17201a; --surface-2:#1f2a22; --border:#2c3a30; --text:#e5ece7; --muted:#9caca1; --faint:#748378;
    --accent:#6dbb7f; --accent-2:#4f8f5e; --accent-soft:#1d3324; --accent-text:#0b140e;
    --danger:#f97066; --danger-soft:#3a1d1b; --warn:#f5b84a; --warn-soft:#3a2c12; --ok:#5fd38a; --ok-soft:#173022; --info:#5cc8dc; --info-soft:#143238;
    --overlay:rgba(0,0,0,.6); --toast-bg:#e5ece7; --toast-fg:#0f1511; --grid:#26322a; --axis:#38473c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --scheme:dark; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1511; --surface:#17201a; --surface-2:#1f2a22; --border:#2c3a30; --text:#e5ece7; --muted:#9caca1; --faint:#748378;
  --accent:#6dbb7f; --accent-2:#4f8f5e; --accent-soft:#1d3324; --accent-text:#0b140e;
  --danger:#f97066; --danger-soft:#3a1d1b; --warn:#f5b84a; --warn-soft:#3a2c12; --ok:#5fd38a; --ok-soft:#173022; --info:#5cc8dc; --info-soft:#143238;
  --overlay:rgba(0,0,0,.6); --toast-bg:#e5ece7; --toast-fg:#0f1511; --grid:#26322a; --axis:#38473c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --scheme:dark; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));min-height:100%}
.app.collapsed{grid-template-columns:72px minmax(0,1fr)}
/* sidebar */
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));height:calc(100vh - 24px - env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;font-weight:700;flex:none}
.logo b{font-size:17px;flex:1;white-space:nowrap}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--muted)}
.navlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 8px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;font-size:11px;background:var(--danger-soft);color:var(--danger);padding:0 7px;border-radius:99px}
.today{margin-top:auto;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:12px 14px;cursor:pointer}
.today small{opacity:.85;font-size:12px;display:block}
.today b{font-size:22px;display:block;line-height:1.3}
.app.collapsed .logo b,.app.collapsed .navlbl,.app.collapsed .nav span,.app.collapsed .nav .badge,.app.collapsed .today{display:none}
.app.collapsed .nav a{justify-content:center;padding:10px}
.app.collapsed .logo{flex-direction:column}
/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.phead{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.phead h1{margin:0;font-size:20px;line-height:1.25;text-wrap:balance}
.phead p{margin:0;color:var(--muted);font-size:12.5px}
.phead .t{flex:1;min-width:200px}
.live{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:5px 12px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on i{background:var(--ok)} .live.bad i{background:var(--danger)}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:7px}
.btn.tint-d{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.tint-i{background:var(--info-soft);color:var(--info);border-color:transparent}
.btn.tint-a{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.notice{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}
.bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1}
.bar input,.bar select{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none;max-width:100%}
.bar input[type=search]{min-width:220px;flex:0 1 340px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;min-width:0}
.stat.click{cursor:pointer}
.stat .k{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.stat .k .ic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.stat .k svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-size:26px;font-weight:700;margin-top:4px}
.stat .s{font-size:12px;color:var(--faint)}
.stat.alert .v{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:0}
.card>.hd{padding:14px 18px 4px}
.card>.hd h2{margin:0;font-size:16px}
.card>.hd p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card>.bd{padding:10px 18px 16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g32{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.chartbox{position:relative;height:260px}
.nodata{height:260px;display:grid;place-items:center;color:var(--faint);text-align:center;padding:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td.num,th.num{font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-weight:600;color:var(--faint);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
th[data-sort]{cursor:pointer}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
td .sub{display:block;color:var(--faint);font-size:12px}
td.nw{white-space:nowrap}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.mut{background:var(--surface-2);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{color:var(--text)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--muted);font-size:13px;gap:8px;flex-wrap:wrap}
.meter{height:6px;width:64px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--accent)}
/* alerts list */
.alist{display:flex;flex-direction:column;gap:8px}
.aitem{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;cursor:pointer;align-items:flex-start}
.aitem:hover{background:var(--surface-2)}
.aitem .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.aitem b{display:block;font-size:13.5px}
.aitem span{color:var(--muted);font-size:12.5px}
/* employee cards */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:12px;min-width:0}
.av{width:64px;height:76px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.ecard .info{min-width:0;flex:1}
.ecard h3{margin:0;font-size:15px;line-height:1.3}
.ecard .meta{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.ecard .acts{margin-top:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border);border-left:1px solid var(--border)}
.cal .dh{padding:6px;text-align:center;font-weight:600;font-size:12.5px;color:var(--muted);border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2)}
.cal .dc{min-height:92px;padding:4px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.cal .dc:hover{background:var(--surface-2)}
.cal .dc.out{color:var(--faint);background:var(--bg)}
.cal .dc.td{background:var(--warn-soft)}
.cal .dn{text-align:right;font-size:12px;font-weight:600}
.ev{display:block;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:6px;padding:1px 4px;margin-top:2px;cursor:pointer}
.ev:hover{background:var(--surface)}
.ev i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--accent)}
.ev.bad i{background:var(--danger)} .ev.done i{background:var(--faint)} .ev.cx{text-decoration:line-through;color:var(--faint)}
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhd h3{margin:0 auto;font-size:17px;text-transform:capitalize}
/* employee full form */
.formlayout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.secnav{position:sticky;top:110px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px}
.secnav a{padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.secnav a:hover{background:var(--surface-2)}
.secnav a.err{color:var(--danger)}
.section{padding:16px 18px;margin-bottom:12px;scroll-margin-top:110px}
.section h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:span 2} .field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}

.field .hint{font-size:12px;color:var(--danger)}
.field .help{font-size:12px;color:var(--faint)}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;outline:none}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.bar input:focus,.bar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field input[readonly]{background:var(--surface-2);color:var(--muted)}
.inline{display:flex;gap:6px;align-items:center}
.inline input{flex:1;min-width:0}
.photo{display:flex;gap:10px;align-items:center}
.photo .av{width:52px;height:62px;font-size:16px}
.savebar{position:sticky;bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;z-index:15}
.savebar .grow{flex:1}
/* dialogs */
.ov{position:fixed;inset:0;background:var(--overlay);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.ov.top{z-index:60}
.dlg{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:760px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.dlg.sm{max-width:440px}
.dlg .dh{padding:16px 20px 6px;display:flex;align-items:center;gap:10px}
.dlg .dh h3{margin:0;font-size:17px;flex:1}
.dlg .db{padding:8px 20px 12px;overflow:auto}
.dlg .db p{margin:0 0 6px;color:var(--muted);white-space:pre-line}
.dlg .df{padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .df .grow{flex:1}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.preview img{max-width:100%;max-height:60vh;border-radius:10px;display:block;margin:0 auto}
/* catalog */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.cat{padding:14px}
.cat h3{margin:0 0 2px;font-size:15px;display:flex;gap:6px;align-items:center}
.cat .help{color:var(--faint);font-size:12px;margin:0 0 8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;font-size:13px}
.chip span{flex:1;min-width:0;overflow-wrap:anywhere}
.chip button{border:0;background:var(--danger-soft);color:var(--danger);border-radius:6px;cursor:pointer;padding:0 7px;font-size:12px}
.addrow{display:flex;gap:6px;margin-top:6px}
.addrow input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:6px 10px;background:var(--surface)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.mx td.c{text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;min-width:62px;font-size:12.5px}
.mx td.c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.mx td.c.sel{outline:2px solid var(--accent);outline-offset:-2px}
.mx td.c small{display:block;color:var(--muted);font-size:11px}
tr.next td{background:var(--accent-soft)}
details.pp summary{cursor:pointer;color:var(--accent);font-size:12.5px;white-space:nowrap}
details.pp ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.muted{color:var(--muted)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <aside class="side">

  S.trainings=!d?RAW.trainings:RAW.trainings.map(t=>({...t,participants:(t.participants||[]).filter(p=>ids.has(p.empId))})).filter(t=>t.participants.length);

async function withRetry(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,500+Math.random()*700));return fn()}throw e}}
function nextCode(list,get,prefix,pad){let max=0;for(const x of list){const m=new RegExp("^"+prefix+"(\\d+)$").exec(get(x)||"");if(m)max=Math.max(max,+m[1])}return prefix+String(max+1).padStart(pad,"0")}

const tmin=t=>{const[h,m]=String(t||"0:0").split(":").map(Number);return h*60+(m||0)};
function ivConflicts(){
  const m=new Map(),list=S.interviews.filter(i=>i.status!=="Đã hủy"&&i.date&&i.start);
  for(let a=0;a<list.length;a++)for(let b=a+1;b<list.length;b++){const x=list[a],y=list[b];if(x.date!==y.date)continue;
    const xe=x.end?tmin(x.end):tmin(x.start)+60,ye=y.end?tmin(y.end):tmin(y.start)+60;
    if(tmin(x.start)<ye&&tmin(y.start)<xe){const why=(x.interviewer&&norm(x.interviewer)===norm(y.interviewer))?"cùng người phỏng vấn "+x.interviewer:(x.candId&&x.candId===y.candId)?"cùng ứng viên":null;
      if(why){(m.get(x._id)||m.set(x._id,[]).get(x._id)).push({other:y,why});(m.get(y._id)||m.set(y._id,[]).get(y._id)).push({other:x,why})}}}
  return m;
}

 {k:"note",l:"Nhận xét",t:"textarea",cls:"full"},

function ivDlg(id,preset={}){
  const i=id?byId("interviews",id):null;
  let data=i;
  if(!i){const c=byId("candidates",preset.candId);const r=c&&byId("requisitions",c.reqId);const rounds=S.interviews.filter(x=>x.candId===preset.candId&&x.status!=="Đã hủy").length;
    data={date:todayISO(),start:"09:00",end:"10:00",round:ROUNDS[Math.min(rounds,2)],status:"Sắp diễn ra",result:"Chờ đánh giá",mode:"Trực tiếp",recruiter:r?r.owner:"",...preset}}
  crudDlg({title:i?"Sửa lịch phỏng vấn":"Tạo lịch phỏng vấn",defs:IV_DEFS(),data,
    extraBtns:i&&i.status!=="Đã hoàn thành"&&canWrite?[mkBtn("Đánh dấu hoàn thành","tint-a",async()=>{try{await saveRec("interviews",id,{...i,_id:undefined,status:"Đã hoàn thành"});closeDlg();toast("Đã cập nhật");scheduleRender()}catch(e){toast(dbErr(e),4500)}})]:[],
    validate:o=>{const e={};if(o.end&&o.start&&tmin(o.end)<=tmin(o.start))e.end="Phải sau giờ bắt đầu";return e},
    onSave:async o=>{
      const rid=id||newId();
      if(o.status!=="Đã hủy"){const clash=S.interviews.filter(x=>x._id!==rid&&x.status!=="Đã hủy"&&x.date===o.date&&tmin(x.start)<tmin(o.end)&&tmin(o.start)<(x.end?tmin(x.end):tmin(x.start)+60)&&((x.interviewer&&norm(x.interviewer)===norm(o.interviewer))||x.candId===o.candId));
        if(clash.length&&!(await ask("Trùng lịch",clash.map(x=>`${x.start}–${x.end} · ${candName(x)} · PV: ${x.interviewer}`).join("\n")+"\n\nVẫn lưu lịch này?",[["Sửa lại",false],["Vẫn lưu",true,"danger"]])))return false}
      await saveRec("interviews",rid,o);
      const c=byId("candidates",o.candId),want="Phỏng vấn "+o.round.toLowerCase();
      if(c&&!id&&PIPE.includes(want)&&PIPE.indexOf(c.status)<PIPE.indexOf(want)){try{await saveRec("candidates",c._id,{...c,_id:undefined,status:want})}catch(_){}}
      toast("Đã lưu lịch phỏng vấn");scheduleRender()},
    onDelete:i?async()=>{if(!(await confirmDel("lịch phỏng vấn này")))return false;await delRec("interviews",id);toast("Đã xoá");scheduleRender()}:null});
}

function periodRange(p){
  const t=todayISO(),d=new Date(t+"T00:00:00"),y=d.getFullYear(),m=d.getMonth();
  if(p.startsWith("m:")){const[yy,mm]=p.slice(2).split("-").map(Number);return[isoOf(new Date(yy,mm-1,1)),isoOf(new Date(yy,mm,0))]}

function trainerConflicts(list){
  const s=new Set();for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];
    if(!a.trainer||norm(a.trainer)!==norm(b.trainer))continue;

    if(a.start&&b.start&&a.end&&b.end&&!(tmin(a.start)<tmin(b.end)&&tmin(b.start)<tmin(a.end)))continue;

}

function tenure(iso,to){if(!iso)return"";const a=new Date(iso+"T00:00:00"),b=new Date((to||todayISO())+"T00:00:00");let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;if(m<0)return"";const y=Math.floor(m/12),r=m%12;return (y?`${y} năm `:"")+(r||!y?`${r} tháng`:"").trim()}
/* các mốc suy ra từ 57 cột, để dòng thời gian không bao giờ trống */
function derivedEvents(f){
  const ev=[],add=(type,date,x={})=>{if(date)ev.push({type,date,auto:true,...x})};
  add("Vào làm",f["Ngày bắt đầu"],{position:f["Vị trí công việc"],dept:f["Phòng ban"]});
  add("Ký HĐ thử việc",f["Ngày thử việc"],{start:f["Ngày thử việc"],end:f["Ngày kết thúc thử việc"],contractNo:f["SỐ HỢP ĐỒNG THỬ VIỆC"],note:f["Trạng thái thử việc"]?"Kết quả: "+f["Trạng thái thử việc"]:""});
  add("Chuyển chính thức",f["Ngày chính thức"]);
  if(f["Loại hợp đồng"]||f["Ngày hết hạn hợp đồng"])add("Ký HĐ lao động",f["Ngày chính thức"]||f["Ngày bắt đầu"],{contractType:f["Loại hợp đồng"],start:f["Ngày chính thức"],end:f["Ngày hết hạn hợp đồng"],contractNo:f["SỐ HỢP ĐỒNG LAO ĐỘNG LÂN 1"]});
  add("Nghỉ việc",f["Ngày nghỉ việc"],{note:f["Lý do nghỉ việc"]});
  return ev;
}
function timelineOf(empId){
  const e=byId("employees",empId),own=S.history.filter(h=>h.empId===empId);
  const der=e?derivedEvents(e.f).filter(d=>!own.some(h=>h.type===d.type||(isContract(d.type)&&d.type!=="Ký HĐ thử việc"&&isContract(h.type)&&h.type!=="Ký HĐ thử việc"))):[];
  return [...own,...der].sort((a,b)=>String(b.date).localeCompare(String(a.date))||(a.auto?1:-1));
}
const isContract=t=>/HĐ|Gia hạn|Phụ lục/.test(t||"");
function histItemHTML(h,editable,latest){

function timelineHTML(empId,editable){const list=timelineOf(empId),lc=list.find(x=>isContract(x.type));return list.length?`<div class="alist">${list.map(h=>histItemHTML(h,editable,h===lc)).join("")}</div>`:'<div class="empty" style="padding:16px">Chưa có mốc nào. Bấm <b>+ Thêm ghi chú</b> để ghi hợp đồng, chuyển chính thức, bổ nhiệm…</div>'}
function empStatusSummary(f){

  if(f["Ngày bắt đầu"])bits.push(`Vào làm ${fmtDate(f["Ngày bắt đầu"])}${p!=="Đã nghỉ"?` · thâm niên ${tenure(f["Ngày bắt đầu"])}`:""}`);

  return bits;
}

async function applyHist(empId,o){
  const e=byId("employees",empId);if(!e)return;const f={...e.f},set=(k,v)=>{if(v!==""&&v!=null)f[k]=v};
  switch(o.type){
    case"Ký HĐ thử việc":set("Ngày thử việc",o.start||o.date);set("Ngày kết thúc thử việc",o.end);set("SỐ HỢP ĐỒNG THỬ VIỆC",o.contractNo);break;

    case"Bổ nhiệm":case"Điều chuyển":set("Vị trí công việc",o.position);set("Phòng ban",o.dept);set("Cấp bậc",o.level);break;
    case"Điều chỉnh lương":if(PERM.sens)set("Lương hiện tại",o.salary);break;
    case"Nghỉ việc":f["Trạng thái"]=STATUS[1];set("Ngày nghỉ việc",o.date);break;
  }

}

function pickFile(accept,cb){const i=$("#fileIn");i.accept=accept||"";i.value="";i.onchange=()=>{const f=i.files[0];if(f)cb(f)};i.click()}
async function uploadFile(file){
  if(!assets){toast("Bạn chưa có quyền tải file lên — dán link file thay thế",4500);return null}
  const ext=(file.name.split(".").pop()||"").toLowerCase(),map={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",txt:"text/plain",csv:"text/csv"};
  const type=map[ext]||file.type;
  if(!["application/pdf","image/png","image/jpeg","image/webp","image/gif","text/plain","text/csv"].includes(type)){toast("Chỉ nhận PDF hoặc ảnh (JPG, PNG, WEBP). File Word/Excel hãy lưu sang PDF hoặc dán link.",5000);return null}
  if(file.size>20*1024*1024){toast("File lớn hơn 20 MB — hãy nén lại hoặc dán link",4500);return null}
  toast("Đang tải file lên…",60000);
  try{const r=await assets.upload(file,{type});toast("Đã tải lên "+file.name);return{...r,name:file.name,type}}
  catch(e){const c=e&&e.code;toast(c==="quota_or_state"?"Bộ nhớ file đã đầy":c==="unsupported_type"?"Định dạng file không được hỗ trợ":c==="too_large"?"File quá lớn":"Tải file thất bại — thử lại",4500);return null}
}

function docDlg(id,preset={}){
  const d=id?byId("documents",id):null;

  let pending=d&&d.fileId?{id:d.fileId,name:d.fileName,type:d.fileType}:null;
  crudDlg({title:d?`Hồ sơ ${d.code}`:"Thêm hồ sơ",defs:DOC_DEFS(),data,
    extraBtns:d&&(d.fileId||d.link)?[mkBtn("Xem hồ sơ","tint-a",()=>previewDoc(id))]:[],
    validate:o=>{const e={};if(S.documents.some(x=>x.code===o.code&&x._id!==id))e.code="Mã đã tồn tại";return e},
    onSave:async o=>{const emp=byId("employees",o.empId);if(!o.name)o.name=`${o.type} ${emp?emp.f["Họ và tên"]:""}`.trim();
      Object.assign(o,pending?{fileId:pending.id,fileName:pending.name,fileType:pending.type}:{fileId:"",fileName:"",fileType:""});
      await saveRec("documents",id||newId(),o);toast("Đã lưu hồ sơ");scheduleRender()},
    onDelete:d?async()=>{if(!(await confirmDel("hồ sơ "+d.code)))return false;await removeDoc(d);toast("Đã xoá");scheduleRender()}:null});
  const pick=$("#m_file_pick");

      if(f==="edit")u.edit=t.checked;if(f==="sens")u.sens=t.checked;
      if(f==="dept"){u.depts=t.checked?[...new Set([...(u.depts||[]),t.value])]:(u.depts||[]).filter(d=>d!==t.value);UI.accOpen=tr.dataset.u}
      if(f!=="dept")u.role="custom"}
    reRender()}));
  if(UI.accOpen){const d=$(`tr[data-u="${CSS.escape(UI.accOpen)}"] details`);if(d)d.open=true;UI.accOpen=null}

/* ======================= EXCEL: NHẬP / XUẤT ======================= */
function toISO(v){
  if(v==null||v==="")return"";
  if(v instanceof Date&&!isNaN(v))return isoOf(v);
  if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:""}
  const s=String(v).trim();let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?m[0]:"";
}
async function runPool(items,worker,n=4){let i=0,done=0,fail=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const it=items[i++];try{await withRetry(()=>worker(it));done++}catch(e){fail++;if(e&&e.code==="quota_exceeded")throw e}toast(`Đang ghi ${done+fail}/${items.length}…`,60000)}}));return{done,fail}}
$("#importFile").addEventListener("change",async ev=>{
  const file=ev.target.files[0];ev.target.value="";if(!file||!db)return;
  if(typeof XLSX==="undefined"){toast("Không tải được thư viện Excel — tải lại trang rồi thử lại",4500);return}
  let recs=[],sn="";
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    sn=wb.SheetNames.find(n=>n.trim()==="Danh sách nhân viên")||wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    const hr=aoa.findIndex(r=>r.some(c=>String(c).trim()==="Mã số NV"));
    if(hr<0){await ask("Không đọc được file",`Không tìm thấy dòng tiêu đề có cột "Mã số NV" trong sheet "${sn}".`,[["Đóng",0,"primary"]]);return}
    const idx={};aoa[hr].forEach((h,i)=>{const k=String(h).trim();if(FIELD[k])idx[k]=i});
    for(const r of aoa.slice(hr+1)){
      if(!String(r[idx["Mã số NV"]]??"").trim()&&!String(r[idx["Họ và tên"]]??"").trim())continue;
      const o={};
      for(const f of INPUT_FIELDS){let v=idx[f.name]!=null?r[idx[f.name]]:"";
        if(f.type==="date")v=toISO(v);
        else if(f.type==="money"||f.type==="int"||f.type==="year"){const d=String(v).replace(/[.,\s]/g,"");v=d===""||isNaN(Number(d))?"":Number(d)}
        else v=v instanceof Date?toISO(v):String(v).trim();
        o[f.name]=v}
      recs.push(o);
    }
  }catch(err){await ask("Không đọc được file",String(err.message||err),[["Đóng",0,"primary"]]);return}
  if(!recs.length){await ask("File trống","Không có dòng dữ liệu nào để nhập.",[["Đóng",0,"primary"]]);return}
  let mode="merge";
  if(S.employees.length){
    mode=await ask(`Nhập ${recs.length} nhân viên`,`Đọc được ${recs.length} nhân viên từ sheet "${sn}". Danh sách chung đang có ${S.employees.length} hồ sơ.\n\nGộp: cập nhật theo Mã số NV, thêm người chưa có (giữ ảnh và hồ sơ đính kèm).\nThay thế: xoá toàn bộ nhân sự hiện có rồi nhập lại.`,[["Huỷ",null],["Thay thế toàn bộ","replace","danger"],["Gộp","merge","primary"]]);
    if(!mode)return;
  }
  const byCode=new Map(RAW.employees.map(e=>[e.f["Mã số NV"],e]));
  const writes=recs.map(o=>{const ex=mode==="merge"&&byCode.get(o["Mã số NV"]);if(ex&&!o["Ảnh nhân viên"]&&ex.f["Ảnh nhân viên"])o["Ảnh nhân viên"]=ex.f["Ảnh nhân viên"];return{id:ex?ex._id:newId(),body:{f:calcEmp(o)}}});
  try{
    if(mode==="replace"){const old=RAW.employees.map(e=>e._id);await runPool(old,id=>db.collection("employees").doc(id).delete());RAW.employees=[];applyScope()}
    const r=await runPool(writes,w=>saveRec("employees",w.id,w.body));
    toast(r.fail?`Đã nhập ${r.done}, lỗi ${r.fail} hồ sơ — thử nhập lại`:`Đã nhập ${r.done} hồ sơ nhân sự`,4500);render();
  }catch(e){toast(dbErr(e),5000)}
});

  if(typeof XLSX==="undefined"){toast("Không tải được thư viện Excel — tải lại trang rồi thử lại",4500);return}

  sheet("Ứng viên",["Mã","Họ và tên","SĐT","Email","Ngày sinh","Giới tính","Nhu cầu","Nguồn","Ngày nhận hồ sơ","Trạng thái","Lương mong muốn","Kết quả","Link CV","Ghi chú"],S.candidates.map(c=>[c.code,c.name,c.phone,c.email,c.birth,c.gender,reqLabel(c.reqId),c.source,c.appliedAt,c.status,c.salary,c.result,c.cv,c.note]),[4,8]);
  sheet("Lịch phỏng vấn",["Ngày","Bắt đầu","Kết thúc","Vòng","Ứng viên","Người phỏng vấn","Phụ trách","Hình thức","Địa điểm","Trạng thái","Kết quả","Nhận xét"],S.interviews.map(i=>[i.date,i.start,i.end,i.round,candName(i),i.interviewer,i.recruiter,i.mode,i.location,i.status,i.result,i.note]),[0]);
  sheet("Hồ sơ",["Mã HS","Mã NV","Nhân sự","Loại","Tên tài liệu","Ngày cấp","Hết hạn","Tình trạng","File","Link","Ghi chú"],S.documents.map(d=>{const e=byId("employees",d.empId);return[d.code,e?e.f["Mã số NV"]:"",empName(d.empId),d.type,d.name,d.issued,d.expiry,docStatus(d)[0],d.fileName,d.link,d.note]}),[5,6]);
  sheet("Quá trình công tác",["Mã NV","Nhân sự","Ngày hiệu lực","Loại","Loại HĐ","Số HĐ / QĐ","Từ ngày","Đến ngày","Vị trí","Cấp bậc","Phòng ban","Lương mới","Ghi chú"],[...S.history].sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(h=>{const e=byId("employees",h.empId);return[e?e.f["Mã số NV"]:"",empName(h.empId),h.date,h.type,h.contractType,h.contractNo,h.start,h.end,h.position,h.level,h.dept,PERM.sens?h.salary:"",h.note]}),[2,6,7]);
  sheet("Khóa đào tạo",["Mã khóa","Nội dung","Loại","Giảng viên","Nguồn GV","Ngày bắt đầu","Ngày kết thúc","Giờ","Số giờ","Địa điểm","Trạng thái","Số học viên","Hoàn thành","Nội dung chi tiết","Tài liệu"],S.trainings.map(t=>{const ps=t.participants||[];return[t.code,t.title,t.category,t.trainer,t.trainerType,t.date,t.endDate,[t.start,t.end].filter(Boolean).join("–"),t.hours,t.location,t.status,ps.length,ps.filter(p=>p.result==="Hoàn thành").length,t.content,t.material]}),[5,6]);
  sheet("Học viên đào tạo",["Mã khóa","Nội dung","Ngày","Mã NV","Họ và tên","Phòng ban","Kết quả","Điểm / nhận xét","Số giờ"],S.trainings.flatMap(t=>(t.participants||[]).map(p=>{const e=byId("employees",p.empId)||{f:{}};return[t.code,t.title,t.date,e.f["Mã số NV"]||"",e.f["Họ và tên"]||"",e.f["Phòng ban"]||"",p.result,p.note,p.result==="Hoàn thành"?t.hours:""]})),[2]);
  const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  try{await downloads.save({filename:`HR_Hung_Phat_${todayISO()}.xlsx`,data:new Blob([buf])});toast("Đã xuất file Excel")}
  catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Đang có một hộp thoại tải xuống — xử lý nó trước");return}toast("Không tải file xuống được ở chế độ xem này",4500)}

/* ======================= KẾT NỐI DỮ LIỆU CHUNG ======================= */
function setLive(state,text){$("#live").className="live "+state;$("#liveText").textContent=text}
function notice(msg){const n=$("#notice");n.hidden=!msg;n.textContent=msg||""}
function lockWrites(){shareWrite=false;canWrite=false;if(!$("#notice").textContent)notice("Bạn đang xem ở chế độ chỉ đọc. Nhờ chủ sở hữu cấp quyền Contributor để thêm hoặc sửa dữ liệu.")}
async function init(){
  route();
  if(!window.claude||!window.claude.use){setLive("bad","Ngoại tuyến");notice("Trang cần được mở trên claude.ai để dùng dữ liệu chung.");Object.keys(S).forEach(k=>LOADED[k]=true);shareWrite=false;ACCESS_LOADED=true;computePerm();return}
  [db,user,downloads,assets]=await Promise.all(["db","user","downloads","assets"].map(n=>claude.use(n).catch(()=>null)));
  if(!db){setLive("bad","Không có quyền");notice("Bạn chưa có quyền xem dữ liệu nhân sự này. Hãy đăng nhập và nhờ chủ sở hữu chia sẻ với quyền Contributor hoặc Editor.");Object.keys(S).forEach(k=>LOADED[k]=true);shareWrite=false;ACCESS_LOADED=true;computePerm();return}
  if(user){try{myId=await user.id()}catch(_){}
    try{myName=(await user.me()).name||""}catch(_){}
    try{const w=await user.can("data.write");if(w===false)lockWrites()}catch(_){}
    try{canAdmin=await user.canEdit()}catch(_){}}
  isAdminUser=!!canAdmin;computePerm();
  db.doc("config/access").onSnapshot(s=>{ACCESS=s.exists?s.data():null;ACCESS_LOADED=true;computePerm()},()=>{ACCESS_LOADED=true;computePerm()});
  const timer=setTimeout(()=>{if(Object.keys(S).some(k=>!LOADED[k])){setLive("bad","Chưa kết nối được");notice("Chưa tải được dữ liệu — kiểm tra kết nối mạng. Trang sẽ tự cập nhật khi kết nối lại.")}},10000);
  let failed=false;
  Object.keys(S).forEach(col=>db.collection(col).onSnapshot(snap=>{
    RAW[col]=snap.docs.map(d=>({_id:d.id,...(d.data()||{})}));
    if(col==="employees")RAW[col].forEach(e=>{e.f=e.f||{}});
    applyScope();
    if(!snap.metadata.fromCache||snap.size)LOADED[col]=true;
    if(Object.keys(S).every(k=>LOADED[k])&&!failed){clearTimeout(timer);notice(canWrite?"":$("#notice").textContent);setLive("on","Đang đồng bộ")}
    scheduleRender();
  },e=>{failed=true;clearTimeout(timer);LOADED[col]=true;setLive("bad","Mất kết nối");notice(e&&e.code==="revoked"?"Quyền truy cập dữ liệu đã thay đổi. Tải lại trang để tiếp tục.":"Mất kết nối dữ liệu chung. Tải lại trang để kết nối lại.");scheduleRender()}));
  db.doc("config/lists").onSnapshot(s=>{const x=s.exists?s.data():null;LISTS={...DEFAULT_LISTS,...((x&&x.lists)||{})};scheduleRender()},()=>{});
}
init();
</script>
